# Keeps the Google reviews snapshot current.
#
# The site is static, so reviews are baked in at build time. Without this, the
# rating on the page freezes at whatever it was on the last content edit — and
# Google Maps Platform terms only allow caching that content for 30 days.
#
# Weekly is well inside the limit and quiet enough not to fill the history with
# no-op commits: the fetch script compares content and exits without writing
# when nothing has changed.
#
# Needs the same GOOGLE_MAPS_API_KEY secret as the deploy workflow.
name: Refresh Google reviews

on:
  schedule:
    # 19:00 UTC Sunday = Monday morning in Melbourne, either side of DST.
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-reviews
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch and commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Fetch reviews
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: npm run reviews

      # The fetch refuses to write if the listing does not match, so anything
      # that lands here came from the right profile. Still worth checking the
      # file is coherent before it becomes a commit.
      - name: Verify
        run: npm run check:content

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- src/data/testimonials.json; then
            echo "No new reviews."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/testimonials.json
          git commit -m "Refresh Google reviews"
          git push
