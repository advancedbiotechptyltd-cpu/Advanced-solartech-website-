<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Staff tool: keep it out of search results entirely. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Content editor — Advanced Solar Tech</title>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #cms-fallback {
        max-width: 640px; margin: 12vh auto; padding: 0 24px; color: #1e2a38; line-height: 1.6;
      }
      #cms-fallback h1 { color: #0a2540; font-size: 22px; }
      #cms-fallback code { background: #eef4fa; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }

      /* Attached to <html>, not <body> — the CMS replaces the body when it
         boots, and anything inside it goes too. */
      #signin-hint {
        position: fixed; inset: 0 0 auto 0; z-index: 2147483647;
        display: flex; gap: 12px; align-items: baseline; justify-content: center;
        padding: 12px 16px; background: #0a2540; color: #fff;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #signin-hint b { color: #ffb020; }
      #signin-hint button {
        border: 1px solid rgba(255,255,255,.4); background: none; color: #fff;
        border-radius: 999px; padding: 2px 10px; font: inherit; cursor: pointer;
      }
      @media (max-width: 640px) { #signin-hint { flex-wrap: wrap; text-align: center; } }
    </style>
  </head>
  <body>
    <!--
      Shown only if the CMS bundle fails to load, so staff get an explanation
      rather than a blank white page.
    -->
    <div id="cms-fallback">
      <h1>Content editor didn't load</h1>
      <p>
        The editor script could not start. This is usually one of two things:
        the site was deployed without <code>/admin/sveltia-cms.js</code>, or you
        are offline.
      </p>
      <p>Nothing is broken on the live site — only this editor.</p>
    </div>

    <!--
      Self-hosted rather than loaded from a CDN. A CDN script would be a
      third-party dependency sitting in front of the tool that edits the whole
      site, and it would break the moment that CDN has a bad day.

      Relative, not "/admin/sveltia-cms.js". This file is copied verbatim from
      public/, so Astro never rewrites its paths for the base — an absolute path
      resolves to the domain root and 404s on the /new staging deploy, which is
      the only place anyone is editing before launch. Relative works at both.
    -->
    <script src="./sveltia-cms.js"></script>
    <script>
      // The CMS replaces the whole body when it boots. If it does, the fallback
      // goes with it; if it doesn't, the message above stays visible.
      window.addEventListener('load', () => {
        setTimeout(() => {
          const el = document.getElementById('cms-fallback')
          if (el && document.querySelector('.sui, #nc-root, .sveltia-cms')) el.remove()
        }, 1500)
      })

      /*
       * The sign-in screen offers "Sign In with GitHub", and on this setup that
       * button is a dead end: with no OAuth proxy configured, the editor falls
       * back to Netlify's auth service, which has no site registered for this
       * domain and answers "Not Found". The button cannot be removed through
       * configuration, so say so before anyone clicks it.
       *
       * Mounted on <html> so it survives the CMS taking over <body>, and
       * dismissed once — whoever signs in daily should not be nagged.
       */
      ;(function () {
        var KEY = 'ast-signin-hint-dismissed'
        try { if (localStorage.getItem(KEY)) return } catch (e) {}

        /*
         * Only warn while there is something to warn about. Once base_url is
         * set in config.yml the OAuth proxy exists and the GitHub button works,
         * at which point this notice would be actively misleading — so read the
         * same config the editor reads rather than trusting a hard-coded
         * assumption to be updated by whoever deploys the Worker.
         */
        fetch('./config.yml')
          .then(function (r) { return r.ok ? r.text() : '' })
          .then(function (yaml) {
            if (/^\s*base_url:\s*\S/m.test(yaml)) return
            showHint()
          })
          .catch(showHint)

        function showHint() {
        var bar = document.createElement('div')
        bar.id = 'signin-hint'
        bar.innerHTML =
          '<span>Sign in with <b>Sign In Using Access Token</b>. ' +
          'The “Sign In with GitHub” button needs an OAuth server this site does not run.</span>'

        var close = document.createElement('button')
        close.type = 'button'
        close.textContent = 'Got it'
        close.addEventListener('click', function () {
          try { localStorage.setItem(KEY, '1') } catch (e) {}
          bar.remove()
        })
        bar.appendChild(close)

        document.documentElement.appendChild(bar)

        // Once a session exists the hint has done its job.
        setInterval(function () {
          if (document.querySelector('[data-collection], .sui-app, nav[aria-label]')) bar.remove()
        }, 2000)
        }
      })()
    </script>
  </body>
</html>
